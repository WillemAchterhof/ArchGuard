#!/usr/bin/env bash

# ==============================================================================
# ArchGuard - Configuration Backup Paths
# ==============================================================================
# /configs/backup-file-paths.conf

declare -gA BACKUP_PATHS=(

    # Neovim
    ["nvim"]="$HOME/.config/nvim"

    # SDDM
    ["sddm"]="/etc/sddm.conf"

    # KDE Plasma - Configuration files
    ["kde-config"]="$HOME/.config/plasma-org.kde.plasma.desktop-appletsrc
    $HOME/.config/kdeglobals
    $HOME/.config/kwinrc
    $HOME/.config/kglobalshortcutsrc
    $HOME/.config/kscreenlockerrc
    $HOME/.config/ksmserverrc
    $HOME/.config/krunnerrc
    $HOME/.config/dolphinrc
    $HOME/.config/konsolerc
    $HOME/.config/systemsettingsrc
    $HOME/.config/autostart"

    # KDE Plasma - Local data
    ["kde-local"]="$HOME/.local/share/plasma
    $HOME/.local/share/icons
    $HOME/.local/share/aurorae
    $HOME/.local/share/konsole
    $HOME/.local/share/kwin/scripts
    $HOME/.local/share/wallpapers
    $HOME/.local/share/knewstuff3
    $HOME/.local/share/fonts"

    # Shell configuration
    ["shell-config"]="$HOME/.bashrc
    $HOME/.zshrc"

    # Backgrounds
    ["background"]="$HOME/Pictures/BackGround"
    
    # Add more configuration paths below
    # ["example"]="/other/config/files"
)